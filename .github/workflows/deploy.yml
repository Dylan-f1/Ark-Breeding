# Redeploys the site on Cloudflare at every merge into main (the final version of the project).
# Needs two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see README).
name: Déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:

# one deployment at a time, the latest push wins
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # public address for canonical links and the sitemap (repository variable, once the domain is set)
      VITE_SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Vérifications
        run: |
          npm run typecheck
          npm test

      - name: Migrations de la base (D1)
        run: npm run db:migrate:remote

      - name: Build et déploiement
        run: npm run deploy
